# Release: a tag v* builds one binary per OS/arch on the matching runner
# (cgo needs a native C toolchain) and attaches them to the GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        run: |
          ext=""; [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          name="mira-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X github.com/JonathanSantos/mira/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" ./cmd/mira
          (cd dist && shasum -a 256 "${name}" > "${name}.sha256")
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
