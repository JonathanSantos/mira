version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - unparam
    - revive
  settings:
    errcheck:
      # `defer x.Close()` em leitura é idiomático; o erro de Close só importa
      # em escrita, onde é checado explicitamente.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        - (*github.com/JonathanSantos/mira/internal/store.Store).Close
        - (io.Closer).Close
        # Saída de texto para stdout: um erro de escrita não tem tratamento útil.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1020", "-ST1021", "-ST1022"]

formatters:
  enable:
    - gofmt
    - goimports
