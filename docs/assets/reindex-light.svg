<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Edits show up in the index right away"><title>Edits show up in the index right away</title><rect width="960" height="400" rx="10" fill="#ffffff"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">Edits show up in the index right away</text><text x="24" y="56" font-size="12" fill="#656d76">Indexing and refresh time on excalidraw (813 files), before and after the fixes, log scale</text><rect x="24" y="76" width="11" height="11" rx="2" fill="#c6ccd2"/><text x="40" y="86" font-size="12" fill="#1f2328">before the fixes</text><rect x="172" y="76" width="11" height="11" rx="2" fill="#7c3aed"/><text x="188" y="86" font-size="12" fill="#1f2328">Mira now</text><line x1="290.0" y1="104" x2="290.0" y2="368" stroke="#d8dee4"/><text x="290.0" y="384" font-size="11" text-anchor="middle" fill="#656d76">10 ms</text><line x1="428.5" y1="104" x2="428.5" y2="368" stroke="#d8dee4"/><text x="428.5" y="384" font-size="11" text-anchor="middle" fill="#656d76">100 ms</text><line x1="567.0" y1="104" x2="567.0" y2="368" stroke="#d8dee4"/><text x="567.0" y="384" font-size="11" text-anchor="middle" fill="#656d76">1 s</text><line x1="705.4" y1="104" x2="705.4" y2="368" stroke="#d8dee4"/><text x="705.4" y="384" font-size="11" text-anchor="middle" fill="#656d76">10 s</text><line x1="843.9" y1="104" x2="843.9" y2="368" stroke="#d8dee4"/><text x="843.9" y="384" font-size="11" text-anchor="middle" fill="#656d76">100 s</text><text x="278" y="128" font-size="12" text-anchor="end" fill="#1f2328">index --full over an existing index</text><rect x="290" y="112" width="591.4" height="12" rx="2" fill="#c6ccd2"/><text x="887.4" y="122" font-size="10" fill="#656d76">3 min 6 s</text><rect x="290" y="126" width="409.1" height="12" rx="2" fill="#7c3aed"/><text x="705.1" y="136" font-size="10" fill="#656d76">9.0 s</text><text x="278" y="172" font-size="12" text-anchor="end" fill="#1f2328">fresh index</text><rect x="290" y="156" width="468.3" height="12" rx="2" fill="#c6ccd2"/><text x="764.3" y="166" font-size="10" fill="#656d76">24.1 s</text><rect x="290" y="170" width="407.8" height="12" rx="2" fill="#7c3aed"/><text x="703.8" y="180" font-size="10" fill="#656d76">8.8 s</text><text x="278" y="216" font-size="12" text-anchor="end" fill="#1f2328">query with an up-to-date index</text><rect x="290" y="200" width="414.8" height="12" rx="2" fill="#c6ccd2"/><text x="710.8" y="210" font-size="10" fill="#656d76">9.9 s</text><rect x="290" y="214" width="24.4" height="12" rx="2" fill="#7c3aed"/><text x="320.4" y="224" font-size="10" fill="#656d76">15 ms</text><text x="278" y="260" font-size="12" text-anchor="end" fill="#1f2328">edit inside App.tsx (12k lines)</text><rect x="290" y="244" width="450.5" height="12" rx="2" fill="#c6ccd2"/><text x="746.5" y="254" font-size="10" fill="#656d76">17.9 s</text><rect x="290" y="258" width="287.9" height="12" rx="2" fill="#7c3aed"/><text x="583.9" y="268" font-size="10" fill="#656d76">1.2 s</text><text x="278" y="304" font-size="12" text-anchor="end" fill="#1f2328">edit inside a small file</text><rect x="290" y="288" width="416.0" height="12" rx="2" fill="#c6ccd2"/><text x="712.0" y="298" font-size="10" fill="#656d76">10.1 s</text><rect x="290" y="302" width="102.5" height="12" rx="2" fill="#7c3aed"/><text x="398.5" y="312" font-size="10" fill="#656d76">55 ms</text><text x="278" y="348" font-size="12" text-anchor="end" fill="#1f2328">file gains an exported function</text><rect x="290" y="332" width="416.0" height="12" rx="2" fill="#c6ccd2"/><text x="712.0" y="342" font-size="10" fill="#656d76">10.1 s</text><rect x="290" y="346" width="102.5" height="12" rx="2" fill="#7c3aed"/><text x="398.5" y="356" font-size="10" fill="#656d76">55 ms</text></g></svg>
